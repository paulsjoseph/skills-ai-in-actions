name: Test Copilot

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  test-copilot:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Show Copilot version
        run: copilot --version

      - name: Test Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Give me a programming joke."
